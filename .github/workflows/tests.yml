name: Standalone calculation tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - name: Verify installed package outside source directory
        run: |
          cd /tmp
          python -c "from astral_nexus_mcp.engines.swiss import EPHE_PATH; assert (EPHE_PATH / 'sepl_18.se1').is_file()"
